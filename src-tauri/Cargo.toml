[package]
name = "mlker-studio"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]
custom-protocol = ["desktop", "tauri/custom-protocol"]

[[bin]]
name = "mlker-studio"
required-features = ["desktop"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
tauri = { version = "2", optional = true , features = [] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3"
