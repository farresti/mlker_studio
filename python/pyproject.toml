[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mlker-graph"
version = "0.3.0"
description = "MLKer Studio model documents, validation, and canonical graph IR"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7", "jsonschema>=4,<5"]

[project.optional-dependencies]
importers = ["torch>=2.6,<3", "timm>=1,<2"]

[tool.setuptools]
packages = ["mlker_graph", "mlker_graph.pytorch", "mlker_import"]

[tool.setuptools.package-data]
mlker_graph = ["schema-v1.json"]
